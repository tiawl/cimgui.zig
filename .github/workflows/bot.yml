name: bot

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update:
    strategy:
      matrix:
        branch:
          - trunk
          - docking
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        repository: "${{ github.repository }}"
        ref: "${{ matrix.branch }}"

    - name: Setup Zig
      uses: mlugg/setup-zig@v2
    - name: Install apt packages
      shell: bash
      run: |
        sudo apt-get update --fix-missing
        sudo apt-get install -y python3-venv mesa-utils
        printf 'ACTIVATE_DIR=bin\n' >> "${GITHUB_ENV}"

    - name: Activate python virtual env & install pip packages
      env:
        RUNNER_TMP: "${{ runner.temp }}"
      shell: bash
      run: |
        python3 -m venv "${RUNNER_TMP}/venv"
        source "${RUNNER_TMP}/venv/${ACTIVATE_DIR:-Scripts}/activate"
        pip install ply

    - name: Setup git user information
      env:
        BRANCH: "bot-${{ matrix.branch }}"
        EMAIL: "<>"
        NAME: "GitHub Actions[bot]"
      shell: bash
      run: |
        git config user.name "${NAME}"
        git config user.email "${EMAIL}"
        git checkout -b "${BRANCH}"

    - name: Fetch
      id: fetch
      env:
        RUNNER_TMP: "${{ runner.temp }}"
      shell: bash
      run: |
        source "${RUNNER_TMP}/venv/${ACTIVATE_DIR:-Scripts}/activate"
        zig build -Dfetch

    - name: Diff
      if: steps.fetch.conclusion == 'success'
      id: diff
      shell: bash
      run: |
        diffs="$(git diff HEAD --name-only | wc -l)"
        printf 'len=%s\n' "${diffs}" >> "${GITHUB_OUTPUT}"

    - name: Update
      if: steps.fetch.conclusion == 'success' && steps.diff.outputs.len != '0'
      env:
        RUNNER_TMP: "${{ runner.temp }}"
      shell: bash
      run: |
        source "${RUNNER_TMP}/venv/${ACTIVATE_DIR:-Scripts}/activate"
        zig build -Dupdate

    - name: Create Pull Request
      if: steps.fetch.conclusion == 'success' && steps.diff.outputs.len != '0'
      env:
        BRANCH: "bot-${{ matrix.branch }}"
        DEFAULT: "${{ matrix.branch }}"
        GH_TOKEN: "${{ github.token }}"
        TITLE: "Update dependencies"
      shell: bash
      run: |
        git add -A
        git commit -m "Bot: ${TITLE}"
        git push --force --set-upstream origin "${BRANCH}"
        gh pr create --base "${DEFAULT}" --fill --reviewer "${GITHUB_REPOSITORY_OWNER}"
