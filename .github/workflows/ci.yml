name: ci

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

on:
  pull_request:
    branches:
      - stable

jobs:
  linter:
    strategy:
      matrix:
        zig-version:
          - latest
          - master
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          repository: "${{ github.event.pull_request.head.repo.full_name }}"
          ref: "${{ github.event.pull_request.head.ref }}"
      - id: lastcommit
        shell: 'bash'
        run: |
          set -x
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Setup zig
        uses: mlugg/setup-zig@v2
        with:
          version: "${{ matrix.zig-version }}"
          cache-key: "${{ github.job }}_${{ runner.os }}_zig-${{ matrix.zig-version }}_${{ matrix.repo || '' }}_${{ steps.lastcommit.outputs.sha }}"
      - name: Check zig is canonical
        shell: 'bash'
        run: zig fmt --check .
  examples:
    strategy:
      matrix:
        zig-version:
          - 0.17.0-dev.1454+5faa79730 # TODO: replace later with - master
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15
    runs-on: "${{ matrix.os }}"
    steps:
      - uses: actions/checkout@v6
        with:
          repository: "${{ github.event.pull_request.head.repo.full_name }}"
          ref: "${{ github.event.pull_request.head.ref }}"
      - id: lastcommit
        shell: 'bash'
        run: |
          set -x
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Setup zig
        uses: mlugg/setup-zig@v2
        with:
          version: "${{ matrix.zig-version }}"
          cache-key: "${{ github.job }}_${{ runner.os }}_zig-${{ matrix.zig-version }}_${{ matrix.repo || '' }}_${{ steps.lastcommit.outputs.sha }}"
      - if: matrix.os == 'windows-2025'
        shell: pwsh
        run: ren "C:\Strawberry\perl\bin\pkg-config.bat" "pkg-config.bat~"
      - name: Test building examples
        shell: 'bash'
        run: |
          set -x
          unset ZIG_LOCAL_CACHE_DIR
          env -C "${GITHUB_WORKSPACE}/examples" zig build
          env -C "${GITHUB_WORKSPACE}/examples" zig build -Ddocking
  maintainance:
    strategy:
      matrix:
        zig-version:
          - latest
          - master
    runs-on: ubuntu-24.04
    steps:
      - name: Install packages
        shell: 'bash'
        run: |
          set -x
          sudo apt-get update --fix-missing
          sudo apt-get install -y python3-venv mesa-utils
          printf 'ACTIVATE_DIR=bin\n' >> "${GITHUB_ENV}"

      - uses: actions/checkout@v6
        with:
          repository: "${{ github.event.pull_request.head.repo.full_name }}"
          ref: "${{ github.event.pull_request.head.ref }}"
      - id: lastcommit
        shell: 'bash'
        run: |
          set -x
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "${{ matrix.zig-version }}"
          cache-key: "${{ github.job }}_${{ runner.os }}_zig-${{ matrix.zig-version }}_${{ matrix.repo || '' }}_${{ steps.lastcommit.outputs.sha }}"

      - name: Activate python virtual env & install pip packages
        env:
          RUNNER_TMP: "${{ runner.temp }}"
        shell: 'bash'
        run: |
          set -x
          python3 -m venv "${RUNNER_TMP}/venv"
          source "${RUNNER_TMP}/venv/${ACTIVATE_DIR:-Scripts}/activate"
          pip install ply

      - name: Test updating
        env:
          RUNNER_TMP: "${{ runner.temp }}"
        shell: 'bash'
        run: |
          set -x
          source "${RUNNER_TMP}/venv/${ACTIVATE_DIR:-Scripts}/activate"
          renderers="$(zig build -Dlist-renderers -Dseparator=,)"
          renderers="${renderers:+"-Drenderers={${renderers}}"}"
          platforms="$(zig build -Dlist-platforms -Dseparator=,)"
          platforms="${platforms:+"-Dplatforms={${platforms}}"}"
          eval "zig build -Dupdate -Dverbose ${renderers} ${platforms}"
