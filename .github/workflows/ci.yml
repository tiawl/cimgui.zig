name: ci

on:
  pull_request:
    branches:
      - trunk
      - docking

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: "${{ github.event.pull_request.head.ref }}"
    - uses: mlugg/setup-zig@v2.0.5
    - name: Check zig is canonical
      shell: bash
      run: |
        zig fmt --check .
  examples:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: "${{ matrix.os }}"
    steps:
    - uses: actions/checkout@v4
      with:
        ref: "${{ github.event.pull_request.head.ref }}"
    - uses: mlugg/setup-zig@v2.0.5
    - name: Test building examples
      shell: bash
      run: |
        unset ZIG_LOCAL_CACHE_DIR
        env -C "${GITHUB_WORKSPACE}/examples" zig build
  build:
    strategy:
      matrix:
        repo:
          - spaceporn
        os:
          - ubuntu-latest
          - windows-latest
        zig_opts:
          - ''
          - '-Ddev'
          - '-Dturbo'
    runs-on: "${{ matrix.os }}"
    steps:
    - uses: actions/checkout@v4
      with:
        repository: "${{ github.repository_owner }}/${{ matrix.repo }}"
    - name: Setup Zig
      uses: mlugg/setup-zig@v2.0.5

    - name: Prepare ${{ matrix.repo }}/build.zig.zon
      env:
        URL: "git+${{ github.server_url }}/${{ github.repository }}#${{ github.event.pull_request.head.sha }}"
      shell: 'bash'
      run: |
        zig fetch --save "${URL}"

    - name: Test building ${{ matrix.repo }}
      env:
        OPTIONS: "${{ matrix.zig_opts }}"
        RUNNER_TMP: "${{ runner.temp }}"
      shell: bash
      run:
        zig build ${OPTIONS}
