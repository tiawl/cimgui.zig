name: ci

on:
  pull_request:
    branches:
      - zig-stable
      - zig-nightly

jobs:
  linter:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        ref: "${{ github.event.pull_request.head.ref }}"
    - name: Setup zig
      uses: mlugg/setup-zig@v2
      with:
        version: "${{ github.event.pull_request.base.ref == 'zig-stable' && 'latest' || 'master' }}"
    - name: Check zig is canonical
      shell: 'bash'
      run: zig fmt --check .
  examples:
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15
    runs-on: "${{ matrix.os }}"
    steps:
    - uses: actions/checkout@v6
      with:
        ref: "${{ github.event.pull_request.head.ref }}"
    - name: Setup zig
      uses: mlugg/setup-zig@v2
      with:
        version: "${{ github.event.pull_request.base.ref == 'zig-stable' && 'latest' || 'master' }}"
    - name: Test building examples
      shell: 'bash'
      run: |
        set -x
        rm -rf .zig-cache
        unset ZIG_LOCAL_CACHE_DIR
        env -C "${GITHUB_WORKSPACE}/examples" zig build
        env -C "${GITHUB_WORKSPACE}/examples" zig build -Ddocking
  maintainance:
    runs-on: ubuntu-24.04
    steps:
    - name: Install packages
      shell: 'bash'
      run: |
        set -x
        sudo apt-get update --fix-missing
        sudo apt-get install -y python3-venv mesa-utils
        printf 'ACTIVATE_DIR=bin\n' >> "${GITHUB_ENV}"

    - uses: actions/checkout@v6
      with:
        ref: "${{ github.event.pull_request.head.ref }}"
    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: "${{ github.event.pull_request.base.ref == 'zig-stable' && 'latest' || 'master' }}"

    - name: Activate python virtual env & install pip packages
      env:
        RUNNER_TMP: "${{ runner.temp }}"
      shell: 'bash'
      run: |
        set -x
        rm -rf .zig-cache
        python3 -m venv "${RUNNER_TMP}/venv"
        source "${RUNNER_TMP}/venv/${ACTIVATE_DIR:-Scripts}/activate"
        pip install ply

    - name: Test updating
      env:
        RUNNER_TMP: "${{ runner.temp }}"
      shell: 'bash'
      run: |
        set -x
        source "${RUNNER_TMP}/venv/${ACTIVATE_DIR:-Scripts}/activate"
        zig build -Dupdate -Dverbose
