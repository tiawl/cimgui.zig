name: ci

on:
  pull_request:
    branches:
      - trunk

env:
  ZIG_VERSION: "0.13.0"

jobs:
  examples:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: "${{ matrix.os }}"
    steps:
    - uses: actions/checkout@v4
    - uses: mlugg/setup-zig@v1
      with:
        version: ${{ env.ZIG_VERSION }}
    - name: Test building examples
      shell: bash
      run: |
        unset ZIG_LOCAL_CACHE_DIR
        zig build --build-file "${GITHUB_WORKSPACE}/examples/build.zig"
  build:
    strategy:
      matrix:
        repo:
          - spaceporn
        os:
          - ubuntu-latest
          - windows-latest
        zig_opts:
          - ''
          - '-Ddev'
          - '-Dturbo'
    runs-on: "${{ matrix.os }}"
    steps:
    - name: Setup Zig
      uses: mlugg/setup-zig@v1
      with:
        version: ${{ env.ZIG_VERSION }}

    - name: Install apt packages
      if: runner.os == 'LINUX'
      shell: bash
      run: |
        sudo apt-get install -y python3-venv mesa-utils
        printf 'ACTIVATE_DIR=bin\n' >> "${GITHUB_ENV}"

    - uses: actions/checkout@v4
      with:
        repository: "${{ github.repository_owner }}/${{ matrix.repo }}"

    - name: Activate python virtual env & install pip packages
      env:
        RUNNER_TMP: "${{ runner.temp }}"
      shell: bash
      run: |
        python3 -m venv "${RUNNER_TMP}/venv"
        source "${RUNNER_TMP}/venv/${ACTIVATE_DIR:-Scripts}/activate"
        pip install ply

    - name: Prepare ${{ matrix.repo }}/build.zig.zon
      env:
        SHA: "${{ github.event.pull_request.head.sha }}"
        URL: "${{ github.server_url }}/${{ github.repository }}/archive"
      shell: bash
      run: |
        old_url="$(grep -o "${URL}/.*\.tar\.gz" build.zig.zon)"
        old_hash="$(zig fetch "${old_url}")"
        new_url="${URL}/${SHA}.tar.gz"
        new_hash="$(zig fetch "${new_url}")"
        sed -i "s@${old_url}@${new_url}@;s@${old_hash}@${new_hash}@" build.zig.zon

    - name: Test building ${{ matrix.repo }}
      env:
        OPTIONS: "${{ matrix.zig_opts }}"
        RUNNER_TMP: "${{ runner.temp }}"
      shell: bash
      run:
        source "${RUNNER_TMP}/venv/${ACTIVATE_DIR:-Scripts}/activate"
        zig build ${OPTIONS}
